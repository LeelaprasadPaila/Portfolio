name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: parallax-portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: parallax-portfolio

      - name: Build normal homepage
        run: npm run build
        working-directory: parallax-portfolio
        env:
          VITE_PORTFOLIO_MODE: 'false'
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_STORAGE_URL: ${{ vars.VITE_STORAGE_URL }}

      - name: Build Parallax Portfolio
        run: npm run build
        working-directory: parallax-portfolio
        env:
          VITE_PORTFOLIO_MODE: 'true'
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_STORAGE_URL: ${{ vars.VITE_STORAGE_URL }}

      - name: Prepare root and portfolio applications
        run: |
          rm -rf pages
          mkdir -p pages/portfolio
          cp -R parallax-portfolio/dist-main/. pages/
          cp -R parallax-portfolio/dist-portfolio/. pages/portfolio/
          cp pages/index.html pages/404.html
          cp pages/portfolio/index.html pages/portfolio/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4